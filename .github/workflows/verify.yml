name: Verify project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node --test --test-timeout=10000 local-adapter/claude-adapter.test.mjs
        working-directory: .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet build desktop/SirDavid.csproj -c Release
      - run: python -m unittest discover -s codex-addon -p "test_*.py"
      - run: python -m unittest discover -s local-adapter/bridge -p "test_agent_bridge.py"
